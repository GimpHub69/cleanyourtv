plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.cleanyourtv.news'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.cleanyourtv.news'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key. Sign your own releases with your key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Test only (never in the APK): a plain JVM test of the feed parser, src/test.
    testImplementation 'junit:junit:4.13.2'
}
